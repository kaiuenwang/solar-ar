<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Solar AR Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #f4f4f4; /* 更柔和的浅灰背景 */
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }
    model-viewer {
      width: 100%;
      height: 90vh;
    }
    .loading {
      color: #333;
      font-size: 1rem;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
<model-viewer
  src="https://developer.apple.com/augmented-reality/quick-look/models/toy_car/toy_car.usdz"
  ar
  auto-rotate
  camera-controls
  style="width: 100%; height: 100vh;">
</model-viewer>

  <div class="loading">🔄 正在加载模型，请稍候…</div>
</body>
</html>
